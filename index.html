const RSI = (C, n) => C.m('rsi' + n, () => { const N = C.N, up = mk(N, 0), dn = mk(N, 0), o = mk(N, 50);

  { n: 'Bybit', page: async (s, end) => (await jget('https://api.bybit.com/v5/market/kline?category=spot&symbol=' + s + '&interval=60&limit=1000' + (end ? '&end=' + end : ''))).result.list.map(k => [+k[0], +k[1], +k[2], +k[3], +k[4], +k[5]]) },
];
async function getBars(sym) {
  let lastErr = null;
  for (const S of SOURCES) {
    try {
      let rows = await S.page(sym); if (!rows.length) throw new Error('boş cavab');
      rows.sort((a, b) => a[0] - b[0]);
      try { const more = await S.page(sym, rows[0][0] - 1); rows = more.concat(rows); } catch (e) { /* bir səhifə kifayətdir */ }
      rows.sort((a, b) => a[0] - b[0]); const seen = new Set(); rows = rows.filter(r => !seen.has(r[0]) && seen.add(r[0]));
      const now = Date.now(); rows = rows.filter(r => r[0] + 3600000 <= now);              // bitməmiş şamı at
      if (rows.length < 400) throw new Error('data azdır');
      const n = rows.length, b = { t: new Float64Array(n), o: new Float64Array(n), h: new Float64Array(n), l: new Float64Array(n), c: new Float64Array(n), v: new Float64Array(n) };
      rows.forEach((r, i) => { b.t[i] = r[0]; b.o[i] = r[1]; b.h[i] = r[2]; b.l[i] = r[3]; b.c[i] = r[4]; b.v[i] = r[5]; });
      return { b, src: S.n };
    } catch (e) { lastErr = e; }
  }
  throw new Error('Data alınmadı (' + (lastErr ? lastErr.message : '?') + '). İnternet var?');
}

// ----------------------------------------------------------------- util
const fmtP = x => x == null ? '—' : x >= 10000 ? x.toFixed(1) : x >= 1 ? x.toFixed(2) : x.toFixed(4);
const pad = n => String(n).padStart(2, '0');
const save = () => { localStorage.setItem('sp_settings', JSON.stringify(st)); localStorage.setItem('sp_hist', JSON.stringify(hist.slice(-300))); };
const COL = { LONG: '#19c37d', SHORT: '#ef4444', WAIT: '#6b7488' };
const TXT = { LONG: '▲ LONG (ALIŞ)', SHORT: '▼ SHORT (SATIŞ)', WAIT: '● GÖZLƏ' };
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); [880, 1320].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(0.2, a.currentTime + i * 0.25); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i * 0.25 + 0.22); o.start(a.currentTime + i * 0.25); o.stop(a.currentTime + i * 0.25 + 0.25); }); } catch (e) { } }
function alertNew(list) {
  if (st.sound) beep(); if (st.vibrate && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if (st.notify && 'Notification' in window && Notification.permission === 'granted') { try { new Notification('SignalPro', { body: list.map(r => LABEL(r.pair) + ': ' + r.signal + ' (' + (r.score > 0 ? '+' : '') + r.score + ')').join('\n') }); } catch (e) { } } }

// ----------------------------------------------------------------- analiz
async function refresh() {
  if (busy) return; busy = true; $('status').textContent = 'Analiz edilir...'; renderCards(true); const fresh = [];
  for (const p of st.pairs) {
    try {
      const { b, src: sname } = await getBars(p); src = sname; await new Promise(r => setTimeout(r, 40));
      const r = SP.analyze(b, st); r.pair = p; r.updated = Date.now(); errs[p] = null;
      const prev = res[p]; res[p] = r;
      let isNew = false;
      for (const e of hist) if (e.pair === p && (!e.status || e.status === 'Açıq')) SP.resolve(e, b);
      if (r.signal !== 'WAIT' && !hist.some(e => e.pair === p && e.barTime === r.barTime)) { hist.push({ pair: p, barTime: r.barTime, signal: r.signal, price: r.price, sl: r.sl, tp: r.tp, score: r.score, status: 'Açıq' }); isNew = true; }
      if (isNew && (!prev || prev.barTime !== r.barTime)) fresh.push(r);
    } catch (e) { errs[p] = e.message; }
    renderCards(); if (selPair === p) renderInd();
  }
  save(); busy = false; renderCards(); renderHist(); setStatus(); if (fresh.length && lastKey !== null) alertNew(fresh);
}
function setStatus() { const t = new Date(); $('status').textContent = (src ? 'Mənbə: ' + src + ' • ' : '') + 'yeniləndi ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()); }

// ----------------------------------------------------------------- render
function renderCards(loading) {
  $('cards').innerHTML = st.pairs.map(p => {
    const r = res[p], e = errs[p]; let h = '<div class="card" data-p="' + p + '"><div class="nm">' + LABEL(p) + ' <span class="mt">' + p + '</span></div>';
    if (e) return h + '<div class="err">' + e + '</div></div>';
    if (!r) return h + '<div class="mt">' + (loading ? 'Hesablanır...' : 'Gözləyin...') + '</div></div>';
    const c = COL[r.signal], w = Math.abs(r.score) / 2, l = r.score >= 0 ? 50 : 50 - w, pc = x => Math.round(100 * x / r.total), t = new Date(r.barTime + 3600000);
    return h.replace('class="card"', 'class="card" style="border-color:' + (r.signal === 'WAIT' ? 'transparent' : c) + '"') + '<div class="sg" style="color:' + c + '">' + TXT[r.signal] + '</div>' +
      '<div class="mt">Skor ' + (r.score > 0 ? '+' : '') + r.score + ' • ' + r.strength + ' • ' + pad(t.getUTCHours()) + ':00 UTC-dən başlayan 1H şam üçün</div>' +
      '<div class="bar"><b></b><i style="left:' + l + '%;width:' + w + '%;background:' + c + '"></i></div><table>' +
      '<tr><td>Giriş</td><td>' + fmtP(r.price) + '</td></tr>' +
      '<tr><td>Stop Loss</td><td style="color:#ef4444">' + fmtP(r.sl) + (r.sl ? ' <small>(' + fmtP(r.slDist) + ' məsafə)</small>' : '') + '</td></tr>' +
      '<tr><td>Take Profit</td><td style="color:#19c37d">' + fmtP(r.tp) + (r.tp ? ' <small>(' + fmtP(r.tpDist) + ' məsafə)</small>' : '') + '</td></tr>' +
      '<tr><td>' + r.total + ' indikator</td><td><b style="color:#19c37d">Long ' + r.bull + '</b> • <b style="color:#ef4444">Short ' + r.bear + '</b> • Neytral ' + r.neutral + '</td></tr>' +
      '<tr><td>100-dən</td><td>Long ' + pc(r.bull) + ' • Short ' + pc(r.bear) + ' • Neytral ' + (100 - pc(r.bull) - pc(r.bear)) + '</td></tr>' +
      '<tr><td>Seans</td><td>' + r.session + '</td></tr></table>' +
      '<div class="mt" style="margin-top:8px">' + (r.signal === 'WAIT' ? '⚠ <b>KRİTİK ANDIR</b> — ' + r.waitReason : 'Səbəblər: ' + r.reasons.join(', ')) + '</div></div>';
  }).join('');
  document.querySelectorAll('.card').forEach(c => c.onclick = () => { selPair = c.dataset.p; renderInd(); });
}
function renderInd() {
  const r = res[selPair]; const pb = st.pairs.map(p => '<button class="chip' + (p === selPair ? ' on' : '') + '" data-p="' + p + '">' + LABEL(p) + '</button>').join('');
  if (!r) { $('ind').innerHTML = '<div class="chips">' + pb + '</div><div class="mt">Hələ hesablanmayıb.</div>'; bindChips(); return; }
  const g = $('grp') ? $('grp').value : 'ALL';
  let rows = r.votes.filter(v => g === 'ALL' || v[1] === g).sort((a, b) => Math.abs(b[2]) - Math.abs(a[2])); const total = rows.length; if (g === 'ALL') rows = rows.slice(0, 150);
  $('ind').innerHTML = '<div class="chips">' + pb + '</div><table class="gt"><tr><th>Qrup</th><th>Alış</th><th>Satış</th><th>Neytral</th></tr>' +
    Object.keys(r.byGroup).map(k => '<tr><td>' + SP.groups[k] + '</td><td style="color:#19c37d">' + r.byGroup[k][0] + '</td><td style="color:#ef4444">' + r.byGroup[k][1] + '</td><td>' + r.byGroup[k][2] + '</td></tr>').join('') + '</table>' +
    '<select id="grp"><option value="ALL">Ən güclü 150 səs</option>' + Object.keys(SP.groups).map(k => '<option value="' + k + '"' + (k === g ? ' selected' : '') + '>' + SP.groups[k] + ' (hamısı)</option>').join('') + '</select>' +
    '<div class="mt">' + total + ' indikatordan ' + rows.length + ' göstərilir. Yaşıl = alış, qırmızı = satış.</div>' +
    rows.map(v => { const x = v[2], c = x > 0.15 ? '#19c37d' : x < -0.15 ? '#ef4444' : '#6b7488'; return '<div class="ir"><span>' + v[0] + '</span><span style="color:' + c + '">' + (x > 0.15 ? '▲' : x < -0.15 ? '▼' : '•') + ' ' + x.toFixed(2) + '</span></div>'; }).join('');
  bindChips(); $('grp').onchange = renderInd;
}
function bindChips() { document.querySelectorAll('.chip').forEach(c => c.onclick = () => { selPair = c.dataset.p; renderInd(); }); }
function renderHist() {
  const n = hist.filter(e => e.nextOk !== undefined), ok = n.filter(e => e.nextOk).length, tp = hist.filter(e => e.status === 'TP').length, sl = hist.filter(e => e.status === 'SL').length;
  $('hist').innerHTML = '<div class="mt"><b>Növbəti şam istiqaməti:</b> ' + ok + '/' + n.length + (n.length ? ' (' + Math.round(100 * ok / n.length) + '%)' : '') + ' düz &nbsp; <b>TP:</b> ' + tp + ' &nbsp; <b>SL:</b> ' + sl + '</div>' +
    (hist.length ? hist.slice().reverse().slice(0, 100).map(e => { const t = new Date(e.barTime + 3600000), c = e.status === 'TP' ? '#19c37d' : e.status === 'SL' ? '#ef4444' : '#8b95ab';
      return '<div class="hr"><div><b style="color:' + COL[e.signal] + '">' + e.signal + '</b> ' + LABEL(e.pair) + '<br><small>' + pad(t.getUTCDate()) + '.' + pad(t.getUTCMonth() + 1) + ' ' + pad(t.getUTCHours()) + ':00 UTC • giriş ' + fmtP(e.price) + '</small></div><div style="color:' + c + ';font-weight:700">' + (e.status || 'Açıq') + '</div></div>'; }).join('') : '<div class="mt">Hələ siqnal tarixçəsi yoxdur.</div>');
}

// ----------------------------------------------------------------- backtest
function bt(msg) { const o = $('btout'); o.textContent += msg; o.scrollTop = o.scrollHeight; }
async function btSelected() {
  $('btout').textContent = ''; for (const p of st.pairs) { try { bt('\n=== ' + LABEL(p) + ' ===\nYüklənir...\n'); const { b } = await getBars(p); await new Promise(r => setTimeout(r, 40));
    const rs = SP.backtest(b, st, [0, 15, 30, 45]); bt(b.t.length + ' saatlıq şam.\nMin.skor | siqnal | növbəti şam düz | TP | SL | vaxt bitdi | expR\n'); rs.forEach(r => bt('  ' + r.thr + '  |  ' + r.signals + '  |  ' + r.acc + '%  |  ' + r.tp + '  |  ' + r.sl + '  |  ' + r.to + '  |  ' + r.expR + '\n')); } catch (e) { bt(p + ': xəta - ' + e.message + '\n'); } }
  bt('\nBitdi. expR > 0 olmalıdır. Spred/komissiya daxil deyil.\n'); }
async function btRank() {
  $('btout').textContent = 'Namizədlər yoxlanır (1-2 dəqiqə)...\n'; const rows = [];
  for (const [p, l] of PAIRS) { try { const { b } = await getBars(p); await new Promise(r => setTimeout(r, 40)); const r = SP.backtest(b, st, [st.waitBand])[0]; bt('  ' + l + ': expR ' + r.expR + ' (' + r.signals + ' siqnal)\n'); if (r.signals >= 30) rows.push([r.expR, l, r]); } catch (e) { bt('  ' + l + ': keçildi (' + e.message + ')\n'); } }
  rows.sort((a, b) => b[0] - a[0]); bt('\nSıralama (ən yaxşı → ən pis):\n' + rows.map((x, i) => '  ' + (i + 1) + '. ' + x[1] + '  expR=' + x[0] + '  düzlük=' + x[2].acc + '%\n').join('') + '\nKeçmiş nəticədir, gələcəyə zəmanət deyil.\n'); }

// ----------------------------------------------------------------- ayarlar
function renderSet() {
  const opt = sel => PAIRS.map(p => '<option value="' + p[0] + '"' + (p[0] === sel ? ' selected' : '') + '>' + p[1] + '</option>').join('');
  $('set').innerHTML = '<label>1-ci cütlük<select id="s1">' + opt(st.pairs[0]) + '</select></label><label>2-ci cütlük<select id="s2">' + opt(st.pairs[1]) + '</select></label>' +
    '<label>WAIT həddi (0-20, kiçik = çox siqnal)<input id="s3" type="number" step="1" value="' + st.waitBand + '"></label><label>Stop Loss (× ATR)<input id="s4" type="number" step="0.1" value="' + st.slMult + '"></label>' +
    '<label>Risk/Reward (1:X)<input id="s5" type="number" step="0.5" value="' + st.rr + '"></label>' +
    '<label class="ck"><input id="c1" type="checkbox"' + (st.sound ? ' checked' : '') + '> Yeni siqnalda səs</label><label class="ck"><input id="c2" type="checkbox"' + (st.vibrate ? ' checked' : '') + '> Titrəmə</label>' +
    '<label class="ck"><input id="c3" type="checkbox"' + (st.notify ? ' checked' : '') + '> Bildiriş (proqram açıq olanda)</label><label class="ck"><input id="c4" type="checkbox"' + (st.awake ? ' checked' : '') + '> Ekranı yanıq saxla</label>' +
    '<button id="sv" class="btn g">Yadda saxla və yenilə</button><button id="tb" class="btn">🔔 Səsi yoxla</button><button id="ins" class="btn b" style="display:' + (installEv ? 'block' : 'none') + '">📲 Ana ekrana qoş</button>' +
    '<div class="mt">Qeyd: XAUUSD siqnalı PAXG/USDT (qızıl tokeni) datasından hesablanır; qiymət brokerin qızıl qiymətindən azca fərqlənə bilər, ona görə SL/TP <b>məsafəsini</b> brokerin qiymətinə tətbiq edin.<br>Bu proqram maliyyə məsləhəti deyil və qazanc zəmanəti vermir.</div>';
  $('sv').onclick = async () => { const a = $('s1').value, b = $('s2').value; if (a === b) { alert('İki fərqli cütlük seçin'); return; }
    st = { ...st, pairs: [a, b], waitBand: +$('s3').value, slMult: +$('s4').value, rr: +$('s5').value, sound: $('c1').checked, vibrate: $('c2').checked, notify: $('c3').checked, awake: $('c4').checked };
    if (st.notify && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); selPair = st.pairs[0]; res = {}; errs = {}; save(); keepAwake(); go('sig'); refresh(); };
  $('tb').onclick = () => { beep(); if (navigator.vibrate) navigator.vibrate(200); }; if ($('ins')) $('ins').onclick = () => installEv && installEv.prompt();
}
async function keepAwake() { try { if (st.awake && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } else if (!st.awake && wake) { wake.release(); wake = null; } } catch (e) { } }

// ----------------------------------------------------------------- navigasiya & taymer
function go(t) { document.querySelectorAll('.tab').forEach(x => x.style.display = x.id === 't_' + t ? 'block' : 'none'); document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'ind') renderInd(); if (t === 'his') renderHist(); if (t === 'set') renderSet(); window.scrollTo(0, 0); }
function tick() { const n = new Date(), nx = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), n.getUTCHours() + 1)), left = Math.floor((nx - n) / 1000);
  $('clock').textContent = pad(n.getUTCHours()) + ':' + pad(n.getUTCMinutes()) + ':' + pad(n.getUTCSeconds()) + ' UTC • növbəti şam ' + pad(Math.floor(left / 60)) + ':' + pad(left % 60);
  const key = n.getUTCFullYear() + '' + n.getUTCMonth() + n.getUTCDate() + n.getUTCHours();
  if (enabled && key !== lastKey && (n.getUTCMinutes() > 0 || n.getUTCSeconds() >= 8) && !busy) { const first = lastKey === null; lastKey = key; refresh(); if (first) lastKey = key; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); const r = res[st.pairs[0]]; if (enabled && (!r || Date.now() - r.updated > 120000)) refresh(); } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; if ($('ins')) $('ins').style.display = 'block'; });

window.addEventListener('load', () => {
  $('onoff').onclick = () => { enabled = !enabled; $('onoff').textContent = enabled ? '● AÇIQ' : '○ BAĞLI'; $('onoff').className = 'tg ' + (enabled ? 'on' : ''); };
  $('now').onclick = () => refresh(); $('b1').onclick = btSelected; $('b2').onclick = btRank;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));
  $('cnt').textContent = SP.count(); renderCards(true); renderHist(); renderSet(); go('sig'); keepAwake(); setInterval(tick, 1000); tick();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => { });
});
})();
